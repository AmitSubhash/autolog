[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-llm-proxy"
version = "0.2.1"
description = "Reusable OpenAI-compatible HTTP proxy that translates requests to claude -p subprocess calls"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = "MIT"

[project.scripts]
claude-proxy = "claude_proxy.__main__:main_cli"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "PLW"]
